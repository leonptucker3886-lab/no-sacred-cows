<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>No Sacred Cows — Leon Link</title>
<meta name="theme-color" content="#0e1419">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1419;--panel:#1b2838;--line:#2a475e;--ink:#c7d5e0;--muted:#8f98a0;--faint:#6a737b;--accent:#66c0f4;--accent2:#1a9fff;--green:#a1cd44;--pad:16px}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--accent);text-decoration:none}a:hover{color:#fff}
nav{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:max(10px,env(safe-area-inset-top,0)) var(--pad) 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,20,25,.95);z-index:40}
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nav-bottom{display:flex;width:100%}
.nav-bottom .cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;background:var(--accent2)!important;color:#fff!important;font-weight:600!important;border-radius:6px;padding:10px 16px}
.brand{color:#fff;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:8px}
.links{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.links a{color:var(--muted);padding:10px;border-radius:4px;font-size:.85rem;min-height:40px;display:inline-flex;align-items:center}
.links a.active,.links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.theme-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:44px;height:44px;border-radius:8px;cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.banner{height:140px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,#1b2838,#1a3a50 45%,#1a9fff33)}
.bar{display:flex;gap:16px;padding:0 var(--pad);margin-top:-40px;align-items:flex-end;padding-bottom:20px;flex-wrap:wrap}
.av{width:80px;height:80px;border-radius:8px;border:3px solid var(--bg);flex-shrink:0;display:grid;place-items:center;background:linear-gradient(145deg,#1a9fff,#1b2838)}
.meta h1{font-size:1.4rem;color:#fff;margin-bottom:4px}
.st{font-size:.85rem;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{display:flex;flex-direction:column}.stat strong{color:#fff}.stat span{font-size:.7rem;color:var(--faint);text-transform:uppercase}
main{max-width:960px;margin:0 auto;padding:8px var(--pad) 40px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border-radius:6px;overflow:hidden;border:1px solid transparent;display:block;color:inherit}
.card:hover{border-color:var(--accent);color:inherit}
.cover{height:90px;display:flex;align-items:flex-end;padding:10px;position:relative}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.75))}
.cover span{position:relative;z-index:1;font-weight:700;color:#fff;font-size:.95rem}
.card-meta{padding:10px 12px}.genre{font-size:.7rem;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:4px}
.blurb{font-size:.8rem;color:var(--muted)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}.cover{height:100px}.banner{height:180px}}
footer{border-top:1px solid var(--line);padding:20px var(--pad);text-align:center;color:var(--muted);font-size:.8rem}footer a{margin:0 8px}
html[data-theme="light"]{--bg:#f4f6f8;--panel:#fff;--line:#d0d7de;--ink:#1a2332;--muted:#5a6570;--faint:#8a939c;--accent:#1a9fff;--accent2:#0d8ae6}
html[data-theme="light"] body{color:var(--ink)}html[data-theme="light"] .brand,.meta h1,.stat strong{color:var(--ink)}
html[data-theme="light"] nav{background:rgba(244,246,248,.95)}
</style>
<script>
(function(){var k='ll-theme',root=document.documentElement,saved=localStorage.getItem(k);
if(saved==='light')root.setAttribute('data-theme','light');else root.removeAttribute('data-theme');
function sync(){var b=document.getElementById('themeBtn');if(b)b.textContent=root.getAttribute('data-theme')==='light'?'\u263E':'\u2600';}
function toggle(){if(root.getAttribute('data-theme')==='light'){root.removeAttribute('data-theme');localStorage.setItem(k,'dark');}else{root.setAttribute('data-theme','light');localStorage.setItem(k,'light');}sync();}
document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('themeBtn');if(b){sync();b.onclick=toggle;}});
})();
</script>
</head>

<script>
const articles=[{name:"The Long Way Home",genre:"Origins",blurb:"Preconception: we were created as humans.",url:"/long-way-home.html",g:"linear-gradient(135deg,#0c2040,#050a14)"},{name:"Commonwealth vs State",genre:"Law",blurb:"Preconception: commonwealth runs courts differently than a state.",url:"/commonwealth.html",g:"linear-gradient(135deg,#1a2a3a,#0c1520)"},{name:"Abrahamic Religions",genre:"Comparison",blurb:"Judaism, Christianity, Islam — shared roots, no winner.",url:"/abrahamic.html",g:"linear-gradient(135deg,#1a3040,#0c1520)"},{name:"The Self-Made Myth",genre:"Culture",blurb:"Preconception: successful people made it alone — no help, no luck, no systems.",url:"/self-made-myth.html",g:"linear-gradient(135deg,#2a1a30,#120c18)"}];

articles.forEach(g=>{const a=document.createElement('a');a.className='card';a.href=g.url;a.innerHTML=`<div class="cover" style="background:${g.g}"><span>${g.name}</span></div><div class="card-meta"><div class="genre">${g.genre}</div><div class="blurb">${g.blurb}</div></div>`;lib.appendChild(a)});
</script>
</main>
